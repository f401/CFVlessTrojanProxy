<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>统计 {{idShort}}</title>
<style>
<!-- @include ../assets/stats.css -->
<!-- @include ../assets/theme.css -->
</style>
<h2>用量</h2>
<div class="table-scroll" tabindex="0" role="region" aria-label="数据表格"><table>
<tr><th>今日</th><td>{{today}}</td></tr>
<tr><th>上行</th><td>{{up}}</td></tr>
<tr><th>下行</th><td>{{down}}</td></tr>
<tr><th>合计</th><td>{{totalRow}}</td></tr>
<tr><th>连接数</th><td>{{conns}}</td></tr>
<tr><th>首次</th><td>{{first}}</td></tr>
<tr><th>最近</th><td>{{last}}</td></tr>
</table></div>
{{bar}}
<h2>实测 RTT（按入口）</h2>
<div class="table-scroll" tabindex="0" role="region" aria-label="数据表格"><table><tr><th>入口标签</th><th>机房</th><th>RTT</th><th>样本</th><th>成功率</th></tr>{{rttRows}}</table></div>
<h2>节点评分（延迟 + 失败率 + 实测吞吐）</h2>
<div class="table-scroll" tabindex="0" role="region" aria-label="数据表格"><table><tr><th>节点</th><th>地区</th><th>探测延迟</th><th>实测吞吐</th><th>成功率</th><th>评分</th></tr>{{nodeRows}}</table></div>
<h2>最近错误</h2>
<div class="table-scroll" tabindex="0" role="region" aria-label="数据表格"><table><tr><th>时间</th><th>内容</th></tr>{{errRows}}</table></div>
</body>
