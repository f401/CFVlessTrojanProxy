<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>统计 {{idShort}}</title>
<style>
body{font:15px/1.6 -apple-system,system-ui,sans-serif;margin:24px;max-width:860px;color:#222}
h2{font-size:17px;margin:24px 0 8px}
table{border-collapse:collapse;width:100%;margin-bottom:6px}
td,th{border:1px solid #ddd;padding:6px 9px;text-align:left}
.u{font-family:ui-monospace,monospace;font-size:13px}
.bar{height:10px;background:#eee;border-radius:5px;overflow:hidden}
.bar>i{display:block;height:100%;background:#2f7ad6}
</style>
<h2>用量</h2>
<table>
<tr><th>今日</th><td>{{today}}</td></tr>
<tr><th>上行</th><td>{{up}}</td></tr>
<tr><th>下行</th><td>{{down}}</td></tr>
<tr><th>合计</th><td>{{totalRow}}</td></tr>
<tr><th>连接数</th><td>{{conns}}</td></tr>
<tr><th>首次</th><td>{{first}}</td></tr>
<tr><th>最近</th><td>{{last}}</td></tr>
</table>
{{bar}}
<h2>实测 RTT（按入口）</h2>
<table><tr><th>入口标签</th><th>机房</th><th>RTT</th><th>样本</th><th>成功率</th></tr>{{rttRows}}</table>
<h2>节点评分（延迟 + 失败率 + 实测吞吐）</h2>
<table><tr><th>节点</th><th>地区</th><th>探测延迟</th><th>实测吞吐</th><th>成功率</th><th>评分</th></tr>{{nodeRows}}</table>
<h2>最近错误</h2>
<table><tr><th>时间</th><th>内容</th></tr>{{errRows}}</table>
</body>
