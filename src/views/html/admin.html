<!doctype html><html lang="zh"><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>用户管理</title>
<style>
<!-- @include ../assets/admin.css -->
<!-- @include ../assets/theme.css -->
</style>
<h1>用户管理</h1>
<div class="sub">共 {{userCount}} 个用户，启用 {{enabledCount}} 个 · 数据存于 KV，面板改动立即生效</div>
{{missNote}}

<form class="add" method="post" action="{{opAction}}">
  <input type="hidden" name="op" value="add">
  备注：<input type="text" name="note" placeholder="例如：朋友A" size="18">
  <button type="submit">新增用户（自动生成 UUID + 密码）</button>
</form>

<div class="table-scroll" tabindex="0" role="region" aria-label="数据表格"><table>
<tr><th>UUID</th><th>Trojan 密码</th><th>备注</th><th>状态</th><th>今日</th><th>累计</th><th>入口</th><th>操作</th></tr>
{{rows}}
</table></div>

<div class="sub" style="margin-top:18px">
新增后把 UUID / 密码发给对方：控制页 <code>{{origin}}/&lt;uuid&gt;</code>，订阅 <code>/&lt;uuid&gt;/cl</code>。
每行「打开」直达该用户控制页，cl/sb/ty 按钮复制对应订阅地址（含访问口令）。
</div>
<script>
(function () {
  /**
   * 功能：生成一次性的提示条 HTML（成功/失败样式）。
   * @param msg 文本（会被转义）
   * @param bad 是否为错误样式
   * @returns HTML 片段
   */
  function flash(b, t) {
    var old = b.getAttribute("data-label") || b.textContent;
    b.textContent = t;
    setTimeout(function () { b.textContent = old; }, 1200);
  }
  document.addEventListener("click", function (e) {
    var b = e.target.closest ? e.target.closest("button[data-copy]") : null;
    if (!b) return;
    var text = b.getAttribute("data-copy");
    /**
     * 功能：浏览器端小函数：复制成功后提示「已复制」（内联进页面，服务端不执行）。
     * @returns 无
     */
    function done() { flash(b, "已复制"); }
    /**
     * 功能：出错时的兜底响应（保留提示，不抛给用户 500）。
     * @param msg 提示文本
     * @returns 响应
     */
    function fallback() {
      try {
        var ta = document.createElement("textarea");
        ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
        document.body.appendChild(ta); ta.select();
        document.execCommand("copy"); document.body.removeChild(ta); done();
      } catch (err) { window.prompt("手动复制：", text); }
    }
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(text).then(done, fallback);
    } else fallback();
  });
})();
</script>
</body></html>
